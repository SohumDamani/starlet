name: Build Rust Wheels

on:
  push:
    branches:
      - rust_demo

jobs:
  build-wheels:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # This tells GitHub to boot up three different virtual machines
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheels using Maturin
        uses: PyO3/maturin-action@v1
        with:
          command: build
          # We point it to rust_demo since your Cargo.toml is inside that folder
          args: --release --out dist -m rust_demo/Cargo.toml

      - name: Upload the compiled wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: dist/*.whl